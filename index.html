<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no" />
<title>Neon Hockey</title>
<style>
  :root{
    --bgA:#040816;
    --bgB:#0a1430;
    --cyan:#00e5ff;
    --pink:#ff2bd6;
    --lime:#a6ff00;
    --white:#eefcff;
    --gold:#ffd700;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;width:100%;height:100%;overflow:hidden;
    background:radial-gradient(circle at center,#12214a 0%,#081226 45%,#03060d 100%);
    font-family:Arial,Helvetica,sans-serif;color:var(--white);touch-action:none;
  }
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:8px;}
  #game{
    position:relative;overflow:hidden;border-radius:22px;
    border:2px solid rgba(0,229,255,.7);
    box-shadow:0 0 12px rgba(0,229,255,.6),0 0 32px rgba(0,229,255,.25),inset 0 0 20px rgba(0,229,255,.15);
    background:radial-gradient(circle at 50% 50%,rgba(255,43,214,.08),transparent 30%),
      linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01)),
      linear-gradient(180deg,var(--bgB),var(--bgA));
    transition: background 0.4s ease, border-color 0.4s ease;
  }
  canvas{width:100%;height:100%;display:block;}
  .hud{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:2;}
  
  .hudTopRow{
    position:absolute;top:8px;left:8px;right:8px;
    display:flex;justify-content:space-between;align-items:center;gap:6px;
    pointer-events:none;z-index:2;
  }
  .hudBadge{
    background:rgba(4,8,22,0.85);border:1px solid rgba(0,229,255,0.4);
    border-radius:999px;padding:5px 12px;font-size:clamp(10px,1.2vw,14px);
    font-weight:700;color:var(--cyan);backdrop-filter:blur(8px);
    box-shadow:0 0 12px rgba(0,229,255,0.22);white-space:nowrap;pointer-events:auto;cursor:pointer;
    transition:transform 0.15s, border-color 0.2s;
  }
  .hudBadge:hover{transform:scale(1.04);}
  
  .hudRightControls{
    display:flex;align-items:center;gap:6px;pointer-events:auto;
  }
  .hudPts{
    background:rgba(4,8,22,0.85);border:1px solid rgba(255,215,0,0.45);
    border-radius:999px;padding:5px 12px;font-size:clamp(10px,1.2vw,14px);
    font-weight:800;color:#ffd700;backdrop-filter:blur(8px);
    box-shadow:0 0 14px rgba(255,215,0,0.25);white-space:nowrap;
  }
  .pauseBtn{
    background:rgba(4,8,22,0.88);border:1px solid rgba(0,229,255,0.45);
    border-radius:999px;padding:5px 12px;font-size:14px;font-weight:800;
    color:var(--cyan);backdrop-filter:blur(8px);box-shadow:0 0 12px rgba(0,229,255,0.3);
    cursor:pointer;pointer-events:auto;transition:transform 0.15s ease, background 0.15s ease;
  }
  .pauseBtn:active{transform:scale(0.92);}

  .scoreboard{
    position:relative;
    display:flex;align-items:center;gap:8px;
    background:rgba(4,8,22,0.78);border:1px solid rgba(0,229,255,0.35);
    border-radius:999px;padding:5px 16px;backdrop-filter:blur(8px);
    box-shadow:0 0 18px rgba(0,229,255,0.22);
  }
  .score{
    font-size:clamp(12px,1.8vw,22px);font-weight:800;letter-spacing:1px;
    text-shadow:0 0 12px currentColor;white-space:nowrap;
  }
  .score.g1{color:var(--cyan)}
  .score.g2{color:var(--pink)}
  .scoreDivider{font-size:clamp(12px,1.8vw,20px);color:rgba(255,255,255,0.35);font-weight:700;}

  /* Modern Neon Glassmorphism Overlay */
  .overlay{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;
    min-width:min(90vw,500px);width:min(90vw,500px);max-height:88vh;overflow-y:auto;text-align:center;
    background:radial-gradient(circle at 50% 0%, rgba(0,229,255,0.12), transparent 70%), rgba(3,8,22,0.92);
    border:1.5px solid rgba(0,229,255,0.45);border-radius:24px;
    padding:22px 18px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:0 0 25px rgba(0,229,255,0.25), 0 10px 40px rgba(0,0,0,0.6), inset 0 0 15px rgba(0,229,255,0.1);
  }
  .overlay::-webkit-scrollbar{width:5px;}
  .overlay::-webkit-scrollbar-thumb{background:rgba(0,229,255,0.5);border-radius:4px;}

  /* Neon Title Header */
  .menuTitleBox{margin-bottom:12px;}
  .menuTitle{
    margin:0;font-size:clamp(28px,5vw,46px);font-weight:900;letter-spacing:2px;
    background:linear-gradient(135deg, #00e5ff 0%, #ffffff 50%, #ff2bd6 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 12px rgba(0,229,255,0.6));
    animation:neonPulse 3s infinite alternate ease-in-out;
  }
  @keyframes neonPulse{
    0%{filter:drop-shadow(0 0 10px rgba(0,229,255,0.5));}
    50%{filter:drop-shadow(0 0 18px rgba(255,43,214,0.7));}
    100%{filter:drop-shadow(0 0 12px rgba(0,229,255,0.5));}
  }
  .menuSubTitle{
    margin:4px 0 0;font-size:clamp(10px,1.3vw,13px);font-weight:700;
    color:#a6ff00;letter-spacing:1px;text-transform:uppercase;opacity:0.9;
  }

  /* Main Action Cards & Grids */
  .mainMenuGrid{
    display:flex;flex-direction:column;gap:10px;margin-top:12px;width:100%;pointer-events:auto;
  }
  .menuHeroBtn{
    display:flex;align-items:center;justify-content:space-between;
    width:100%;padding:14px 18px;border-radius:18px;border:1.5px solid rgba(0,229,255,0.5);
    background:linear-gradient(135deg, rgba(0,229,255,0.2), rgba(4,14,36,0.85));
    color:#ffffff;font-size:15px;font-weight:800;cursor:pointer;
    box-shadow:0 0 15px rgba(0,229,255,0.2), inset 0 0 10px rgba(0,229,255,0.1);
    transition:transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .menuHeroBtn:active{transform:scale(0.97);}
  .menuHeroBtn.pink{
    border-color:rgba(255,43,214,0.5);
    background:linear-gradient(135deg, rgba(255,43,214,0.2), rgba(30,6,26,0.85));
    box-shadow:0 0 15px rgba(255,43,214,0.2), inset 0 0 10px rgba(255,43,214,0.1);
  }
  .menuHeroBtnLeft{display:flex;align-items:center;gap:12px;text-align:left;}
  .menuHeroIcon{font-size:24px;}
  .menuHeroTitle{font-size:15px;font-weight:800;line-height:1.2;}
  .menuHeroSub{font-size:11px;font-weight:600;opacity:0.75;margin-top:2px;}
  .menuHeroArrow{font-size:16px;opacity:0.8;}

  /* 2-Column Mobile Sub-Buttons */
  .menuSubGrid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:2px;width:100%;
  }
  .menuSubBtn{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:12px 10px;border-radius:16px;border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.06);color:#eefcff;font-size:13px;font-weight:700;
    cursor:pointer;backdrop-filter:blur(8px);
    transition:transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .menuSubBtn:active{transform:scale(0.96);}
  .menuSubBtn.gold{border-color:rgba(255,215,0,0.5);background:rgba(255,215,0,0.12);color:#ffd700;}
  .menuSubBtn.green{border-color:rgba(166,255,0,0.4);background:rgba(166,255,0,0.1);color:#a6ff00;}
  .menuSubBtnIcon{font-size:18px;margin-bottom:3px;}
  .menuSubBtnText{font-size:12px;font-weight:700;line-height:1.2;}

  /* Back Button Styling */
  .btnBackNav{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    width:100%;margin-top:10px;padding:12px 20px;border-radius:999px;
    border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);
    color:#eefcff;font-size:14px;font-weight:700;cursor:pointer;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .btnBackNav:active{transform:scale(0.96);}

  .btnRow{margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;pointer-events:auto;}
  button{
    border:none;border-radius:999px;padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;
    color:#03131f;background:linear-gradient(90deg,var(--cyan),#8af5ff);box-shadow:0 0 12px rgba(0,229,255,.45);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button:active{transform:scale(0.96);}
  button.alt{background:linear-gradient(90deg,var(--pink),#ff9af0);box-shadow:0 0 12px rgba(255,43,214,.45);}
  button.green{background:linear-gradient(90deg,var(--lime),#d4ff80);box-shadow:0 0 12px rgba(166,255,0,.45);}
  button.gold{background:linear-gradient(90deg,#ffd700,#fff080);box-shadow:0 0 12px rgba(255,215,0,.5);color:#1a1400;}

  .note{
    position:absolute;bottom:8px;left:50%;transform:translateX(-50%);z-index:2;text-align:center;
    font-size:clamp(11px,1.3vw,16px);color:rgba(234,252,255,.7);padding:0 10px;pointer-events:none;
  }
  .hidden{display:none}

  /* Post Match & Profile Styles */
  .pmStatsGrid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0;text-align:left;
  }
  .pmStatCard{
    background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);
    border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;
    font-size:clamp(11px,1.3vw,14px);font-weight:700;color:#eefcff;
  }
  .pmStatCard span:last-child{color:var(--cyan);font-weight:800;}

  .pmXPSection{
    background:rgba(4,8,22,0.75);border:1px solid rgba(0,229,255,0.3);
    border-radius:14px;padding:12px;margin:10px 0;
  }
  .pmXPHeader{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,0.7);}
  .pmXPTotal{font-size:clamp(16px,2.2vw,24px);font-weight:900;color:#ffd700;margin:6px 0;text-shadow:0 0 12px rgba(255,215,0,0.5);}
  .pmXPBarWrap{
    width:100%;height:14px;background:rgba(255,255,255,0.1);border-radius:999px;
    overflow:hidden;margin:6px 0;border:1px solid rgba(0,229,255,0.25);position:relative;
  }
  .pmXPBarFill{
    height:100%;background:linear-gradient(90deg,var(--cyan),#ffd700);
    border-radius:999px;transition:width 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    box-shadow:0 0 10px var(--cyan);
  }
  .pmXPBarLabels{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#eefcff;}

  .levelUpBanner{
    background:linear-gradient(135deg,rgba(255,43,214,0.35),rgba(0,229,255,0.35));
    border:2px solid #ffd700;border-radius:14px;padding:12px;margin:12px 0;
    animation:pulseGlow 1.5s infinite alternate;
  }
  @keyframes pulseGlow{
    0%{box-shadow:0 0 10px rgba(255,215,0,0.4);}
    100%{box-shadow:0 0 25px rgba(255,215,0,0.9);}
  }
  .luTitle{font-size:15px;font-weight:900;color:#ffd700;letter-spacing:1px;}
  .luBadge{font-size:22px;font-weight:800;color:#fff;margin:4px 0;}
  .luUnlockText{font-size:12px;color:#d9f7ff;}

  .profileSection{
    background:rgba(4,8,22,0.8);border:1px solid rgba(0,229,255,0.3);
    border-radius:14px;padding:14px;margin-bottom:12px;text-align:left;
  }
  .profileHeader{display:flex;align-items:center;gap:12px;}
  .profileAvatar{font-size:36px;}
  .profileInfo{flex:1;}
  .profileInfo h2{margin:0;font-size:18px;color:var(--cyan);}
  .profileInfo p{margin:2px 0 0;font-size:12px;color:rgba(238,252,255,0.7);}

  .lvlList{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;margin-top:10px;padding-right:4px;}
  .lvlItem{
    display:flex;align-items:center;justify-content:space-between;
    background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
    border-radius:10px;padding:8px 12px;font-size:13px;
  }
  .lvlItem.unlocked{background:rgba(0,229,255,0.08);border-color:rgba(0,229,255,0.3);}
  .lvlItem.active{background:rgba(255,215,0,0.15);border-color:#ffd700;}

  .garageGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px;}
  .garageItem{
    background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);
    border-radius:12px;padding:10px;text-align:center;cursor:pointer;
    transition:transform 0.15s, border-color 0.15s;pointer-events:auto;
  }
  .garageItem:hover{transform:scale(1.03);}
  .garageItem.selected{border-color:#ffd700;box-shadow:0 0 12px rgba(255,215,0,0.4);background:rgba(255,215,0,0.12);}
  .garageItem.locked{opacity:0.55;cursor:not-allowed;filter:grayscale(0.5);}
  .garageItemTitle{font-size:12px;font-weight:700;margin-top:4px;}
  .garageItemSub{font-size:10px;opacity:0.75;}
</style>
</head>
<body>
<div id="wrap">
  <div id="game">
    <canvas id="c"></canvas>
    <div class="hud">
      <div class="hudTopRow">
        <div class="hudBadge" id="hudBadge" title="Clicca per aprire Profilo e Livelli">💙 Lv.1 Neon Blu</div>
        <div class="scoreboard" id="scoreboardBox">
          <div class="score g2" id="scoreG2El">CPU (Medio) 0</div>
          <div class="scoreDivider">-</div>
          <div class="score g1" id="scoreG1El">0 TU</div>
        </div>
        <div class="hudRightControls">
          <div class="hudPts" id="hudPtsBox"><span id="hudPtsVal">0</span> <span style="font-size:0.75em;opacity:0.85;">PTS</span></div>
          <button id="pauseBtn" class="pauseBtn" title="Metti in Pausa">⏸️ Pausa</button>
        </div>
      </div>
    </div>
    <div id="overlay" class="overlay">
      <div class="menuTitleBox">
        <h1 class="menuTitle">NEON HOCKEY</h1>
        <div class="menuSubTitle">⚡ AIR HOCKEY • OBIETTIVO 7 GOL</div>
      </div>
      <div class="mainMenuGrid">
        <button id="btn1p" class="menuHeroBtn">
          <div class="menuHeroBtnLeft">
            <span class="menuHeroIcon">🕹️</span>
            <div>
              <div class="menuHeroTitle">1 Giocatore</div>
              <div class="menuHeroSub">Sfida la CPU e scala i livelli XP</div>
            </div>
          </div>
          <span class="menuHeroArrow">➔</span>
        </button>

        <button id="btn2p" class="menuHeroBtn pink">
          <div class="menuHeroBtnLeft">
            <span class="menuHeroIcon">👥</span>
            <div>
              <div class="menuHeroTitle">2 Giocatori</div>
              <div class="menuHeroSub">Sfida un amico sullo stesso schermo</div>
            </div>
          </div>
          <span class="menuHeroArrow">➔</span>
        </button>

        <div class="menuSubGrid">
          <button id="profileBtn" class="menuSubBtn gold">
            <span class="menuSubBtnIcon">🏆</span>
            <span class="menuSubBtnText">Profilo & Livelli</span>
          </button>
          
          <button id="colorBtn" class="menuSubBtn">
            <span class="menuSubBtnIcon">🎨</span>
            <span class="menuSubBtnText">Garage Neon</span>
          </button>
        </div>

        <button id="audioBtn" class="menuSubBtn green" style="width:100%;">
          <span class="menuSubBtnText">🔊 Audio: ON</span>
        </button>
      </div>
    </div>
    <div class="note">Premi ⏸️ o ESC per mettere in pausa • Multitouch attivo</div>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const gameEl = document.getElementById('game');
  const overlay = document.getElementById('overlay');
  const scoreG1El = document.getElementById('scoreG1El');
  const scoreG2El = document.getElementById('scoreG2El');
  const scoreboardBox = document.getElementById('scoreboardBox');
  const hudBadgeEl = document.getElementById('hudBadge');
  const hudPtsValEl = document.getElementById('hudPtsVal');

  let W=1200,H=700;
  let DPR=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  let running=false, isPaused=false, audioEnabled=true, lastTime=0, flash=0;
  let particles=[], floatingTexts=[], portrait=false;
  let gameMode=null;
  const pointerOwners = new Map();

  const state = { g1:0, g2:0, max:7 };
  let countdownText = "";
  let inCountdown = false;
  let isScoring = false;
  let serveTarget = true;
  let countdownTimer = null;

  let aiDifficulty = 'medium';
  let stuckTimer = 0;
  let stuckNudgeTimer = 0;
  let isRetreating = false;
  let retreatTimer = 0;

  // 10 NEON LEVELS SYSTEM
  const LEVELS = [
    { level: 1, name: 'Neon Blu', xp: 0, color: '#00e5ff', glow: 'rgba(0,229,255,0.6)', badge: '💙', themeKey: 'cyan', skin: 'classic', trail: 'cyan_spark' },
    { level: 2, name: 'Neon Viola', xp: 300, color: '#b537ff', glow: 'rgba(181,55,255,0.6)', badge: '💜', themeKey: 'purple', skin: 'violet_pulse', trail: 'purple_pulse' },
    { level: 3, name: 'Neon Rosa', xp: 700, color: '#ff2bd6', glow: 'rgba(255,43,214,0.6)', badge: '🩷', themeKey: 'pink', skin: 'pink_star', trail: 'pink_sparkle' },
    { level: 4, name: 'Neon Verde', xp: 1200, color: '#a6ff00', glow: 'rgba(166,255,0,0.6)', badge: '💚', themeKey: 'lime', skin: 'lime_bolt', trail: 'lime_bolt' },
    { level: 5, name: 'Neon Arancione', xp: 1800, color: '#ff8800', glow: 'rgba(255,136,0,0.6)', badge: '🧡', themeKey: 'orange', skin: 'fire_ember', trail: 'fire_ember' },
    { level: 6, name: 'Neon Rosso', xp: 2500, color: '#ff2255', glow: 'rgba(255,34,85,0.6)', badge: '🔴', themeKey: 'red', skin: 'red_crest', trail: 'red_nova' },
    { level: 7, name: 'Neon Oro', xp: 3500, color: '#ffd700', glow: 'rgba(255,215,0,0.6)', badge: '👑', themeKey: 'gold', skin: 'golden_crown', trail: 'gold_glitter' },
    { level: 8, name: 'Neon Plasma', xp: 5000, color: '#00ffcc', glow: 'rgba(0,255,204,0.6)', badge: '⚡', themeKey: 'plasma', skin: 'plasma_core', trail: 'plasma_wave' },
    { level: 9, name: 'Neon Ultra', xp: 7000, color: '#ff00ff', glow: 'rgba(255,0,255,0.6)', badge: '🌌', themeKey: 'ultra', skin: 'ultra_aura', trail: 'ultra_aura' },
    { level: 10, name: 'Neon Leggendario', xp: 10000, color: '#ffffff', glow: 'rgba(255,255,255,0.8)', badge: '🐉', themeKey: 'legendary', skin: 'legend_dragon', trail: 'legend_rainbow' }
  ];

  const playerThemes = {
    cyan: { name: '🩵 Neon Blu', reqLevel: 1, reqXP: 0, color: '#00e5ff', glow: 'rgba(0,229,255,0.6)', bg: 'radial-gradient(circle at 50% 50%,rgba(0,229,255,.14),transparent 45%), linear-gradient(180deg,rgba(0,229,255,.03),rgba(0,229,255,.01)), linear-gradient(180deg,#0a1430,#040816)' },
    purple: { name: '💜 Neon Viola', reqLevel: 2, reqXP: 300, color: '#b537ff', glow: 'rgba(181,55,255,0.6)', bg: 'radial-gradient(circle at 50% 50%,rgba(181,55,255,.14),transparent 45%), linear-gradient(180deg,rgba(181,55,255,.03),rgba(181,55,255,.01)), linear-gradient(180deg,#1c092b,#0a0212)' },
    pink: { name: '🩷 Neon Rosa', reqLevel: 3, reqXP: 700, color: '#ff2bd6', glow: 'rgba(255,43,214,0.6)', bg: 'radial-gradient(circle at 50% 50%,rgba(255,43,214,.14),transparent 45%), linear-gradient(180deg,rgba(255,43,214,.03),rgba(255,43,214,.01)), linear-gradient(180deg,#2b0422,#12010e)' },
    lime: { name: '💚 Neon Verde', reqLevel: 4, reqXP: 1200, color: '#a6ff00', glow: 'rgba(166,255,0,0.6)', bg: 'radial-gradient(circle at 50% 50%,rgba(166,255,0,.14),transparent 45%), linear-gradient(180deg,rgba(166,255,0,.03),rgba(166,255,0,.01)), linear-gradient(180deg,#0e2608,#040e02)' },
    orange: { name: '🧡 Neon Arancio', reqLevel: 5, reqXP: 1800, color: '#ff8800', glow: 'rgba(255,136,0,0.6)', bg: 'radial-gradient(circle at 50% 50%,rgba(255,136,0,.14),transparent 45%), linear-gradient(180deg,rgba(255,136,0,.03),rgba(255,136,0,.01)), linear-gradient(180deg,#2b1104,#0f0501)' },
    red: { name: '🔴 Neon Rosso', reqLevel: 6, reqXP: 2500, color: '#ff2255', glow: 'rgba(255,34,85,0.6)', bg: 'radial-gradient(circle at 50% 50%,rgba(255,34,85,.14),transparent 45%), linear-gradient(180deg,rgba(255,34,85,.03),rgba(255,34,85,.01)), linear-gradient(180deg,#2d030c,#120105)' },
    gold: { name: '👑 Neon Oro', reqLevel: 7, reqXP: 3500, color: '#ffd700', glow: 'rgba(255,215,0,0.6)', bg: 'radial-gradient(circle at 50% 50%,rgba(255,215,0,.14),transparent 45%), linear-gradient(180deg,rgba(255,215,0,.03),rgba(255,215,0,.01)), linear-gradient(180deg,#2b2304,#120e01)' },

  let selectedThemeKey = 'cyan';

  // PERSISTENCE HELPERS
  function getStoredXP(){
    const saved = localStorage.getItem('hockeyneon_xp');
    return saved ? parseInt(saved, 10) || 0 : 0;
  }
  function addXP(amount){
    const prev = getStoredXP();
    const next = Math.max(0, prev + amount);
    localStorage.setItem('hockeyneon_xp', next);
    return { prev, next };
  }
  function getLevelInfo(xp){
    let currentLvl = LEVELS[0];
    for(let i=0; i<LEVELS.length; i++){
      if(xp >= LEVELS[i].xp) currentLvl = LEVELS[i];
      else break;
    }
    const idx = LEVELS.findIndex(l => l.level === currentLvl.level);
    const nextLvl = LEVELS[idx + 1] || null;
    let progress = 1;
    if(nextLvl){
      progress = Math.min(1, Math.max(0, (xp - currentLvl.xp) / (nextLvl.xp - currentLvl.xp)));
    }
    return { currentLevel: currentLvl, nextLevel: nextLvl, progress, index: idx };
  }

  // OFFICIAL MATCH SCORING STATE

  // FLOATING TEXT NOTIFICATIONS
  function addFloatingText(x, y, text, color, scale = 1){
    floatingTexts.push({
      x, y, text, color,
      life: 1.35, maxLife: 1.35,
      vy: 34, scale
    });
  }
  function updateFloatingTexts(dt){
    for(let i = floatingTexts.length - 1; i >= 0; i--){
      const ft = floatingTexts[i];
      ft.life -= dt;
      ft.y -= ft.vy * dt;
      if(ft.life <= 0) floatingTexts.splice(i, 1);
    }
  }
  function drawFloatingTexts(){
    for(const ft of floatingTexts){
      const alpha = Math.min(1, ft.life / (ft.maxLife * 0.35));
      ctx.save();
      ctx.globalAlpha = Math.max(0, alpha);
      const size = Math.round(Math.min(W, H) * 0.036 * ft.scale);
      ctx.font = '900 ' + Math.max(13, size) + 'px Arial, Helvetica, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const textWidthEst = ctx.measureText(ft.text).width || 100;
      const marginX = textWidthEst / 2 + 10;
      const clampedX = clamp(ft.x, marginX, W - marginX);
      const clampedY = clamp(ft.y, 45, H - 24);

      ctx.shadowColor = ft.color;
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = ft.color;
      ctx.lineWidth = 3.5;
      ctx.strokeText(ft.text, clampedX, clampedY);
      ctx.fillText(ft.text, clampedX, clampedY);
      ctx.restore();
    }
  }

  const puck = { x:0,y:0,vx:0,vy:0,r:16 };
  const g1Paddle = { x:0,y:0,tx:0,ty:0,vx:0,vy:0,r:38,speed:18 }; 
  const g2Paddle = { x:0,y:0,tx:0,ty:0,vx:0,vy:0,r:38,speed:18 }; 

  let audioCtx=null;
  function initAudio(){
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
  }
  function beep(freq=440,dur=.06,type='sine',vol=.03,slide=0){
    if(!audioEnabled) return;
    initAudio();
    const now=audioCtx.currentTime;
    const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
    osc.type=type; osc.frequency.setValueAtTime(freq,now);
    if(slide) osc.frequency.linearRampToValueAtTime(freq+slide,now+dur);
    gain.gain.setValueAtTime(0.0001,now);
    gain.gain.exponentialRampToValueAtTime(vol,now+.01);
    gain.gain.exponentialRampToValueAtTime(0.0001,now+dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now+dur+.03);
  }
  function playHit(s){ beep(260+Math.min(s*10,500),.05,'square',.03,80); }
  function playWall(){ beep(300,.04,'triangle',.02,-60); }
  function playScoreGood(){ beep(660,.07,'sawtooth',.03,120); setTimeout(()=>beep(840,.08,'triangle',.025,60),60); }
  function playScoreBad(){ beep(180,.12,'square',.035,-100); setTimeout(()=>beep(120,.12,'triangle',.025,-40),70); }
  function playWin(){ beep(520,.08,'triangle',.025,80); setTimeout(()=>beep(740,.08,'triangle',.025,100),90); setTimeout(()=>beep(980,.14,'triangle',.03,0),180); }
  function playPointGain(){ beep(740,.05,'triangle',.035,100); setTimeout(()=>beep(1020,.07,'sine',.03,50),40); }
  function playPenalty(){ beep(180,.08,'sawtooth',.04,-40); setTimeout(()=>beep(130,.1,'square',.035,-20),50); }
  function playLevelUpFanfare(){ beep(520,.08,'triangle',.04,100); setTimeout(()=>beep(660,.08,'triangle',.04,120),80); setTimeout(()=>beep(880,.1,'triangle',.045,140),160); setTimeout(()=>beep(1170,.25,'sine',.05,0),260); }

  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function norm(x,y){ const d=Math.hypot(x,y)||1; return {x:x/d,y:y/d}; }
  function isPortrait(){ return window.innerHeight>window.innerWidth; }

  function applyRinkTheme(){
    const theme = playerThemes[selectedThemeKey] || playerThemes.cyan;
    gameEl.style.background = theme.bg;
    gameEl.style.borderColor = theme.color;
    gameEl.style.boxShadow = '0 0 16px '+theme.glow+', 0 0 36px rgba(0,0,0,0.4), inset 0 0 20px '+theme.glow;
    scoreG1El.style.color = theme.color;
    scoreboardBox.style.borderColor = theme.color;
  }

  function resize(){
    portrait=isPortrait();
    const pad=8, aw=window.innerWidth-pad*2, ah=window.innerHeight-pad*2;
    let gw,gh;
    if(portrait){ gh=Math.min(ah,aw*1.6); gw=Math.min(aw,gh/1.6); }
    else{ gw=Math.min(aw,ah*1.6); gh=Math.min(ah,gw/1.6); }
    gameEl.style.width=gw+'px'; gameEl.style.height=gh+'px';
    const rect=canvas.getBoundingClientRect();
    W=Math.round(rect.width); H=Math.round(rect.height);
    canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    applyRinkTheme();
    updateHUDPoints();
    if(!running) resetPositions(false);
  }

  function resetPositions(serveToG2){
    serveTarget = serveToG2 !== undefined ? serveToG2 : Math.random()>0.5;
    if(portrait){
      g1Paddle.x=W/2; g1Paddle.y=H*0.82; g1Paddle.tx=g1Paddle.x; g1Paddle.ty=g1Paddle.y;
      g2Paddle.x=W/2; g2Paddle.y=H*0.18; g2Paddle.tx=g2Paddle.x; g2Paddle.ty=g2Paddle.y;
    } else {
      g1Paddle.x=W*0.85; g1Paddle.y=H/2; g1Paddle.tx=g1Paddle.x; g1Paddle.ty=g1Paddle.y;
      g2Paddle.x=W*0.15; g2Paddle.y=H/2; g2Paddle.tx=g2Paddle.x; g2Paddle.ty=g2Paddle.y;
    }
    g1Paddle.vx=g1Paddle.vy=g2Paddle.vx=g2Paddle.vy=0;
    puck.x=W/2; puck.y=H/2; puck.vx=0; puck.vy=0;
    stuckTimer=0; stuckNudgeTimer=0; isRetreating=false; retreatTimer=0;
  }

  function launchPuck(serveToG2){
    const angle=Math.random()*0.9-0.45, speed=Math.max(W,H)*0.52;
    if(portrait){ puck.vx=Math.sin(angle)*speed; puck.vy=(serveToG2?1:-1)*speed; }
    else{ puck.vx=(serveToG2?-1:1)*speed; puck.vy=Math.sin(angle)*speed; }
  }

  function startCountdown(onComplete){
    if(countdownTimer) clearInterval(countdownTimer);
    inCountdown = true;
    let count = 3;
    countdownText = "3";
    beep(440, .1, 'sine', .05);

    countdownTimer = setInterval(function(){
      if(isPaused) return;
      count--;
      if(count === 2){
        countdownText = "2";
        beep(440, .1, 'sine', .05);
      } else if(count === 1){
        countdownText = "1";
        beep(440, .1, 'sine', .05);
      } else if(count === 0){
        countdownText = "VIA!";
        beep(880, .25, 'triangle', .06);
      } else {
        clearInterval(countdownTimer);
        countdownTimer = null;
        countdownText = "";
        inCountdown = false;
        if(onComplete) onComplete();
      }
    }, 650);
  }

  function addParticles(x,y,color,count){
    count=count||14;
    for(let i=0;i<count;i++){
      const a=Math.random()*Math.PI*2, s=1+Math.random()*4.5;
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:18+Math.random()*20,maxLife:18+Math.random()*20,color});
    }
  }

  function collidePaddle(pad,color){
    const dx=puck.x-pad.x, dy=puck.y-pad.y, d=Math.hypot(dx,dy), minD=puck.r+pad.r;
    if(d<minD){
      const n=norm(dx,dy);
      const t={x:-n.y,y:n.x};
      puck.x=pad.x+n.x*(minD+.5);
      puck.y=pad.y+n.y*(minD+.5);

      const padPush=0.28;
      const pvx=pad.vx*padPush, pvy=pad.vy*padPush;
      const rvx=puck.vx-pvx, rvy=puck.vy-pvy;
      const normalIn=rvx*n.x+rvy*n.y;
      const tangentIn=rvx*t.x+rvy*t.y;

      if(normalIn<0){
        const bounce=1.03;
        const outNormal=-normalIn*bounce;
        puck.vx = n.x*outNormal + t.x*tangentIn + pvx + pad.vx*0.10;
        puck.vy = n.y*outNormal + t.y*tangentIn + pvy + pad.vy*0.10;
      }

      const pushAlong = Math.max(0, pad.vx*n.x + pad.vy*n.y);
      puck.vx += n.x * pushAlong * 0.18 + t.x * (pad.vx*t.x + pad.vy*t.y) * 0.08;
      puck.vy += n.y * pushAlong * 0.18 + t.y * (pad.vx*t.y + pad.vy*t.y) * 0.08;

      let sp=Math.hypot(puck.vx,puck.vy);
      const minSpeed=Math.max(W,H)*0.34;
      const maxSpeed=Math.max(W,H)*1.55;
      if(sp<minSpeed){ puck.vx=puck.vx/sp*minSpeed; puck.vy=puck.vy/sp*minSpeed; sp=minSpeed; }
      if(sp>maxSpeed){ puck.vx=puck.vx/sp*maxSpeed; puck.vy=puck.vy/sp*maxSpeed; sp=maxSpeed; }

      playHit(sp/100); addParticles(puck.x,puck.y,color,18); flash=4;

      // DEFENSE & RECOVERY ACTION DETECTION
      if(pad === g1Paddle){
        const inDefensiveHalf = portrait ? (g1Paddle.y > H/2) : (g1Paddle.x > W/2);
        const headingToGoal = portrait ? (puck.vy > 90) : (puck.vx > 90);

        if(matchScoreState.lastHitBy === 'g2' && inDefensiveHalf){
          if(headingToGoal){
            // PARATA (+30)
            matchScoreState.pts += 30;
            matchScoreState.saves++;
            addFloatingText(g1Paddle.x, g1Paddle.y - 30, '+30 PARATA!', '#00e5ff', 1.15);
            playPointGain();
          } else {
            // RECUPERO DISCO (+20)
            matchScoreState.pts += 20;
            matchScoreState.recoveries++;
            addFloatingText(g1Paddle.x, g1Paddle.y - 30, '+20 RECUPERO!', '#a6ff00', 1.1);
            playPointGain();
          }
          updateHUDPoints();
        }

        matchScoreState.lastHitBy = 'g1';
        matchScoreState.lastG1HitTime = performance.now();
        matchScoreState.lastG1HitPos = { x: g1Paddle.x, y: g1Paddle.y };
        matchScoreState.bouncesSinceG1Hit = 0;
      } else if(pad === g2Paddle){
        // Check if G1 lost puck in defense
        const inG1Half = portrait ? (puck.y > H/2) : (puck.x > W/2);
        if(matchScoreState.lastHitBy === 'g1' && inG1Half){
          const now = performance.now();
          if(!matchScoreState.lastPuckLossTime || (now - matchScoreState.lastPuckLossTime > 1500)){
            matchScoreState.lastPuckLossTime = now;
            matchScoreState.pts = Math.max(0, matchScoreState.pts - 10);
            matchScoreState.puckLosses++;
            addFloatingText(puck.x, puck.y - 20, '-10 DISCO PERSO!', '#ff8800', 1.05);
            playPenalty();
            updateHUDPoints();
          }
        }
        matchScoreState.lastHitBy = 'g2';
      }
    }
  }

  function scoreG1(){
    if(isScoring || inCountdown || isPaused) return;
    isScoring = true;
    puck.vx = 0; puck.vy = 0;
    state.g1++;
    scoreG1El.textContent = gameMode==='1p' ? `${state.g1} TU` : `${state.g1} G1`;

    let goalPts = 100;
    matchScoreState.goals++;
    
    let notifications = [];
    notifications.push({ text: '+100 GOL!', color: '#00e5ff' });

    // 1. Gol da lontano
    const g1HalfHit = portrait ? (matchScoreState.lastG1HitPos.y > H/2) : (matchScoreState.lastG1HitPos.x > W/2);
    if(g1HalfHit && matchScoreState.lastHitBy === 'g1'){
      goalPts += 150;
      matchScoreState.longGoals++;
      notifications.push({ text: '+150 GOL DA LONTANO!', color: '#ffd700' });
    }

    // 2. Gol veloce (entro 1 sec)
    const timeSinceHit = (performance.now() - matchScoreState.lastG1HitTime) / 1000;
    if(timeSinceHit <= 1.0 && matchScoreState.lastHitBy === 'g1'){
      goalPts += 200;
      matchScoreState.fastGoals++;
      notifications.push({ text: '+200 GOL VELOCE!', color: '#a6ff00' });
    }

    // 3. Gol rimbalzato
    if(matchScoreState.bouncesSinceG1Hit >= 1 && matchScoreState.lastHitBy === 'g1'){
      goalPts += 180;
      matchScoreState.bounceGoals++;
      notifications.push({ text: '+180 GOL RIMBALZATO!', color: '#ff2bd6' });
    }

    // 4. Gol decisivo (7°)
    if(state.g1 >= state.max){
      goalPts += 300;
      matchScoreState.decisiveGoal = true;
      notifications.push({ text: '+300 GOL DECISIVO!', color: '#ff2255' });
    }

    matchScoreState.pts += goalPts;
    updateHUDPoints();

    notifications.forEach((n, idx) => {
      setTimeout(() => {
        addFloatingText(puck.x, puck.y - idx * 28, n.text, n.color, 1.15);
      }, idx * 130);
    });

    playScoreGood();
    playPointGain();
    const pColor = playerThemes[selectedThemeKey].color;
    if(portrait) addParticles(puck.x,20,pColor,35); else addParticles(20,puck.y,pColor,35);
    postGoal(true);
  }

  function scoreG2(){
    if(isScoring || inCountdown || isPaused) return;
    isScoring = true;
    puck.vx = 0; puck.vy = 0;
    state.g2++;
    
    const deficit = state.g2 - state.g1;
    if(deficit > matchScoreState.maxDeficit) matchScoreState.maxDeficit = deficit;

    const diffNames = { easy:'Facile', medium:'Medio', hard:'Difficile' };
    scoreG2El.textContent = gameMode==='1p' ? `CPU (${diffNames[aiDifficulty]}) ${state.g2}` : `G2 ${state.g2}`;
    playScoreBad();
    if(portrait) addParticles(puck.x,H-20,'#ff2bd6',30); else addParticles(W-20,puck.y,'#ff2bd6',30);
    postGoal(false);
  }

  function postGoal(serveToG2){
    countdownText = "GOL!";
    const reachedMax = (state.g1 >= state.max || state.g2 >= state.max);
    setTimeout(function(){
      countdownText = "";

        running=false;
        isScoring=false;
        inCountdown=false;

        let matchBonuses = [];
        let bonusXP = 0;

        if(state.g1 >= state.max){
          matchBonuses.push({ name: '🏆 Vittoria', xp: 500, color: '#00e5ff' });
          bonusXP += 500;

          if(state.g2 === 0){
            matchBonuses.push({ name: '⚡ Perfect Match (7–0)', xp: 1000, color: '#ffd700' });
            bonusXP += 1000;
          }
          if(matchScoreState.maxDeficit >= 3){
            matchBonuses.push({ name: '🔥 Rimonta Elica', xp: 300, color: '#ff2bd6' });
            bonusXP += 300;
          }
          if(state.g2 === 0){
            matchBonuses.push({ name: '🛡️ Nessun Gol Subito', xp: 200, color: '#a6ff00' });
            bonusXP += 200;
          }
        }

        const actionPTS = matchScoreState.pts;
        const totalXPBonus = actionPTS + bonusXP;

            </div>
          </div>

          ${leveledUp ? `
            <div class="levelUpBanner">
              <div class="luTitle">🎉 NUOVO LIVELLO NEON SBLOCCATO! 🎉</div>
              <div class="luBadge">${newLvl.currentLevel.badge} ${newLvl.currentLevel.name}</div>

          <div class="btnRow">

      } else {
        isScoring = false;
        resetPositions(serveToG2);
        startCountdown(function(){
          launchPuck(serveToG2);
        });
      }
    }, 1100);
  }

  function updateAI(dt){
    const puckSpeed = Math.hypot(puck.vx, puck.vy);
    const distToPuck = Math.hypot(puck.x - g2Paddle.x, puck.y - g2Paddle.y);

    if(puckSpeed < 50 && distToPuck < g2Paddle.r + puck.r + 35){
      stuckTimer += dt;
      if(stuckTimer > 0.3 && !isRetreating){
        isRetreating = true;
        retreatTimer = 0.45;
      }
    } else {
      stuckTimer = Math.max(0, stuckTimer - dt);
    }

    if(puckSpeed < 6){
      stuckNudgeTimer += dt;
      if(stuckNudgeTimer > 1.8){
        stuckNudgeTimer = 0;
        const nudgeSpeed = Math.max(W, H) * 0.28;
        if(portrait){
          puck.vy = (g2Paddle.y < H/2) ? nudgeSpeed : -nudgeSpeed;
        } else {
          puck.vx = (g2Paddle.x < W/2) ? nudgeSpeed : -nudgeSpeed;
        }
      }
    } else {
      stuckNudgeTimer = 0;
    }

    if(isRetreating){
      retreatTimer -= dt;
      if(retreatTimer <= 0){
        isRetreating = false;
      }
      if(portrait){
        g2Paddle.tx += (W/2 - g2Paddle.tx) * Math.min(1, dt*14);
        g2Paddle.ty += (H*0.08 - g2Paddle.ty) * Math.min(1, dt*14);
      } else {
        g2Paddle.tx += (W*0.08 - g2Paddle.tx) * Math.min(1, dt*14);
        g2Paddle.ty += (H/2 - g2Paddle.ty) * Math.min(1, dt*14);
      }
      return;
    }

    let reactSpeed = 9;
    let predictFactor = 0;
    if(aiDifficulty === 'easy'){
      reactSpeed = 5;
      predictFactor = 0;
    } else if(aiDifficulty === 'medium'){
      reactSpeed = 9.5;
      predictFactor = 0.10;
    } else if(aiDifficulty === 'hard'){
      reactSpeed = 16.5;
      predictFactor = 0.24;
    }

    let targetPuckX = puck.x + puck.vx * predictFactor;
    let targetPuckY = puck.y + puck.vy * predictFactor;

    if(portrait){
      const aimX = clamp(targetPuckX, 30+g2Paddle.r, W-30-g2Paddle.r);
      let aimY = H*0.18;
      if(puck.y < H/2){
        aimY = clamp(targetPuckY + 45, 30+g2Paddle.r, H/2-24-g2Paddle.r);
      }
      g2Paddle.tx += (aimX - g2Paddle.tx) * Math.min(1, dt * reactSpeed);
      g2Paddle.ty += (aimY - g2Paddle.ty) * Math.min(1, dt * reactSpeed);
    } else {
      let aimX = W*0.15;
      if(puck.x < W/2){
        aimX = clamp(targetPuckX - 45, 30+g2Paddle.r, W/2-24-g2Paddle.r);
      }
      const aimY = clamp(targetPuckY, 30+g2Paddle.r, H-30-g2Paddle.r);
      g2Paddle.tx += (aimX - g2Paddle.tx) * Math.min(1, dt * reactSpeed);
      g2Paddle.ty += (aimY - g2Paddle.ty) * Math.min(1, dt * reactSpeed);
    }
  }

  function update(dt){
    if(isPaused) return;
    const lerp = 1 - Math.pow(.001, dt);
    const prevG1x=g1Paddle.x, prevG1y=g1Paddle.y, prevG2x=g2Paddle.x, prevG2y=g2Paddle.y;

    g1Paddle.x += (g1Paddle.tx-g1Paddle.x)*Math.min(1,lerp*g1Paddle.speed);
    g1Paddle.y += (g1Paddle.ty-g1Paddle.y)*Math.min(1,lerp*g1Paddle.speed);
    if(gameMode==='2p'){
      g2Paddle.x += (g2Paddle.tx-g2Paddle.x)*Math.min(1,lerp*g2Paddle.speed);
      g2Paddle.y += (g2Paddle.ty-g2Paddle.y)*Math.min(1,lerp*g2Paddle.speed);
    } else {
      updateAI(dt);
      const cpuSpeed = aiDifficulty==='easy' ? 7 : (aiDifficulty==='hard' ? 17 : 12);
      g2Paddle.x += (g2Paddle.tx-g2Paddle.x)*Math.min(1,lerp*cpuSpeed);
      g2Paddle.y += (g2Paddle.ty-g2Paddle.y)*Math.min(1,lerp*cpuSpeed);
    }

    const m=30;
    if(portrait){
      g2Paddle.x=clamp(g2Paddle.x,m+g2Paddle.r,W-m-g2Paddle.r);
      g2Paddle.y=clamp(g2Paddle.y,m+g2Paddle.r,H/2-24-g2Paddle.r);
      g1Paddle.x=clamp(g1Paddle.x,m+g1Paddle.r,W-m-g1Paddle.r);
      g1Paddle.y=clamp(g1Paddle.y,H/2+24+g1Paddle.r,H-m-g1Paddle.r);
    } else {
      g2Paddle.x=clamp(g2Paddle.x,m+g2Paddle.r,W/2-24-g2Paddle.r);
      g2Paddle.y=clamp(g2Paddle.y,m+g2Paddle.r,H-m-g2Paddle.r);
      g1Paddle.x=clamp(g1Paddle.x,W/2+24+g1Paddle.r,W-m-g1Paddle.r);
      g1Paddle.y=clamp(g1Paddle.y,m+g1Paddle.r,H-m-g1Paddle.r);
    }

    g1Paddle.vx=(g1Paddle.x-prevG1x)/Math.max(dt,0.001);
    g1Paddle.vy=(g1Paddle.y-prevG1y)/Math.max(dt,0.001);
    g2Paddle.vx=(g2Paddle.x-prevG2x)/Math.max(dt,0.001);
    g2Paddle.vy=(g2Paddle.y-prevG2y)/Math.max(dt,0.001);

    // Check Heavy Paddle Collision Penalty (-20)
    const padDist = Math.hypot(g1Paddle.x - g2Paddle.x, g1Paddle.y - g2Paddle.y);
    const minDist = g1Paddle.r + g2Paddle.r;
    if(padDist < minDist){
      const n = norm(g1Paddle.x - g2Paddle.x, g1Paddle.y - g2Paddle.y);
      const overlap = minDist - padDist;
      g1Paddle.x += n.x * overlap * 0.5;
      g1Paddle.y += n.y * overlap * 0.5;
      g2Paddle.x -= n.x * overlap * 0.5;
      g2Paddle.y -= n.y * overlap * 0.5;

      const g1Speed = Math.hypot(g1Paddle.vx, g1Paddle.vy);
      const relSpeed = Math.hypot(g1Paddle.vx - g2Paddle.vx, g1Paddle.vy - g2Paddle.vy);
      const maxDim = Math.max(W, H);

      if(g1Speed > maxDim * 0.85 || relSpeed > maxDim * 1.1){
        const now = performance.now();
        if(!matchScoreState.lastHeavyCollisionTime || (now - matchScoreState.lastHeavyCollisionTime > 1200)){
          matchScoreState.lastHeavyCollisionTime = now;
          matchScoreState.pts = Math.max(0, matchScoreState.pts - 20);
          matchScoreState.heavyCollisions++;
          addFloatingText((g1Paddle.x + g2Paddle.x)/2, (g1Paddle.y + g2Paddle.y)/2, '-20 SCONTRO FORTE!', '#ff2255', 1.1);
          playPenalty();
          addParticles((g1Paddle.x + g2Paddle.x)/2, (g1Paddle.y + g2Paddle.y)/2, '#ff2255', 16);
          updateHUDPoints();
        }
      }
    }

    if(inCountdown){
      puck.x = W/2; puck.y = H/2; puck.vx = 0; puck.vy = 0;
    } else if(isScoring){
      puck.vx = 0; puck.vy = 0;
    } else {
      puck.x+=puck.vx*dt; puck.y+=puck.vy*dt;
      puck.vx*=.999; puck.vy*=.999;
    }

    const theme = playerThemes[selectedThemeKey] || playerThemes.cyan;
    if(portrait){
      if(puck.x-puck.r<18){
        puck.x=18+puck.r;puck.vx*=-1;playWall();addParticles(puck.x,puck.y,theme.color,6);
        if(matchScoreState.lastHitBy==='g1') matchScoreState.bouncesSinceG1Hit++;
      }
      if(puck.x+puck.r>W-18){
        puck.x=W-18-puck.r;puck.vx*=-1;playWall();addParticles(puck.x,puck.y,theme.color,6);
        if(matchScoreState.lastHitBy==='g1') matchScoreState.bouncesSinceG1Hit++;
      }
    } else {
      if(puck.y-puck.r<18){
        puck.y=18+puck.r;puck.vy*=-1;playWall();addParticles(puck.x,puck.y,theme.color,6);
        if(matchScoreState.lastHitBy==='g1') matchScoreState.bouncesSinceG1Hit++;
      }
      if(puck.y+puck.r>H-18){
        puck.y=H-18-puck.r;puck.vy*=-1;playWall();addParticles(puck.x,puck.y,theme.color,6);
        if(matchScoreState.lastHitBy==='g1') matchScoreState.bouncesSinceG1Hit++;
      }
    }

    const gs = portrait ? W*.28 : H*.28;
    let inGoal = portrait ? (puck.x>(W-gs)/2 && puck.x<(W+gs)/2) : (puck.y>(H-gs)/2 && puck.y<(H+gs)/2);

    if(portrait){
      if(puck.y-puck.r<0 && inGoal){ scoreG1(); return; }
      if(puck.y+puck.r>H && inGoal){ scoreG2(); return; }
      if(puck.y-puck.r<0){puck.y=puck.r;puck.vy*=-1;playWall();}
      if(puck.y+puck.r>H){puck.y=H-puck.r;puck.vy*=-1;playWall();}
    } else {
      if(puck.x-puck.r<0 && inGoal){ scoreG1(); return; }
      if(puck.x+puck.r>W && inGoal){ scoreG2(); return; }
      if(puck.x-puck.r<0){puck.x=puck.r;puck.vx*=-1;playWall();}
      if(puck.x+puck.r>W){puck.x=W-puck.r;puck.vx*=-1;playWall();}
    }

    if(!inCountdown && !isScoring){
      collidePaddle(g1Paddle,theme.color);
      collidePaddle(g2Paddle,'#ff2bd6');
    }

    updateFloatingTexts(dt);
    particles = particles.filter(function(p){ return p.life>0; });
    for(const p of particles){ p.x+=p.vx; p.y+=p.vy; p.vx*=.98; p.life-=1; }
    if(flash>0) flash-=1;
  }

  function drawRink(){
    ctx.clearRect(0,0,W,H);
    if(flash>0){ ctx.fillStyle='rgba(255,255,255,'+(0.03*flash)+')'; ctx.fillRect(0,0,W,H); }
    ctx.save();
    
    const theme = playerThemes[selectedThemeKey] || playerThemes.cyan;
    ctx.strokeStyle=theme.glow; ctx.lineWidth=3; ctx.shadowColor=theme.color; ctx.shadowBlur=16;
    roundRect(12,12,W-24,H-24,22,false,true);
    ctx.beginPath();
    if(portrait){ ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); } else { ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); }
    ctx.stroke();
    ctx.beginPath(); ctx.arc(W/2,H/2,Math.min(W,H)*0.11,0,Math.PI*2); ctx.stroke();

    const gs = portrait ? W*.28 : H*.28;
    ctx.strokeStyle='rgba(255,43,214,.75)'; ctx.shadowColor='#ff2bd6'; ctx.lineWidth=4;
    ctx.beginPath();
    if(portrait){ ctx.moveTo((W-gs)/2,10); ctx.lineTo((W+gs)/2,10); }
    else{ ctx.moveTo(10,(H-gs)/2); ctx.lineTo(10,(H+gs)/2); }
    ctx.stroke();

    ctx.strokeStyle=theme.color; ctx.shadowColor=theme.color;
    ctx.beginPath();
    if(portrait){ ctx.moveTo((W-gs)/2,H-10); ctx.lineTo((W+gs)/2,H-10); }
    else{ ctx.moveTo(W-10,(H-gs)/2); ctx.lineTo(W-10,(H+gs)/2); }
    ctx.stroke();
    ctx.restore();
  }

  function drawPaddle(x,y,r,color){
    ctx.save(); ctx.shadowColor=color; ctx.shadowBlur=18;
    const g=ctx.createRadialGradient(x-r*.3,y-r*.3,r*.25,x,y,r);
    g.addColorStop(0,'#ffffff'); g.addColorStop(.18,color); g.addColorStop(1,'rgba(255,255,255,.08)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.lineWidth=3; ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.stroke();

    ctx.beginPath(); ctx.fillStyle='rgba(255,255,255,.18)';
    ctx.arc(x-r*.25,y-r*.25,r*.25,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawPuck(){
    const theme = playerThemes[selectedThemeKey] || playerThemes.cyan;
    ctx.save(); ctx.shadowColor=theme.color; ctx.shadowBlur=14;
    const g=ctx.createRadialGradient(puck.x-4,puck.y-4,3,puck.x,puck.y,puck.r);
    g.addColorStop(0,'#ffffff'); g.addColorStop(.35,theme.color); g.addColorStop(1,'#444444');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(puck.x,puck.y,puck.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawParticles(){
    for(const p of particles){
      const a=Math.max(0,p.life/p.maxLife);
      ctx.save(); ctx.globalAlpha=a; ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=6;
      ctx.beginPath(); ctx.arc(p.x,p.y,2.5,0,Math.PI*2); ctx.fill(); ctx.restore();
    }
  }

  function drawCountdown(){
    if(!countdownText) return;
    ctx.save();
    const size = Math.round(Math.min(W,H)*0.22);
    ctx.font = '900 ' + size + 'px Arial, Helvetica, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    const theme = playerThemes[selectedThemeKey] || playerThemes.cyan;
    let glowColor = theme.color;
    if(countdownText === 'VIA!') glowColor = '#a6ff00';
    else if(countdownText === 'GOL!') glowColor = '#ff2bd6';

    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 35;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(countdownText, W/2, H/2);
    ctx.restore();
  }

  function roundRect(x,y,w,h,r,fill,stroke){
    ctx.beginPath(); ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath(); if(fill) ctx.fill(); if(stroke) ctx.stroke();
  }

  function draw(){
    drawRink();
    drawParticles();
    const theme = playerThemes[selectedThemeKey] || playerThemes.cyan;
    drawPaddle(g2Paddle.x,g2Paddle.y,g2Paddle.r,'#ff2bd6');
    drawPaddle(g1Paddle.x,g1Paddle.y,g1Paddle.r,theme.color);
    drawPuck();
    drawFloatingTexts();
    drawCountdown();
  }

  function loop(ts){
    if(!lastTime) lastTime=ts;
    const dt=Math.min(.022,(ts-lastTime)/1000);
    lastTime=ts;
    if(running && !isPaused) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

      const statusText = isUnlocked ? (isActive ? 'ATTIVO' : 'SBLOCCATO') : `${lvl.xp} XP`;
      lvlItemsHtml += `
        <div class="lvlItem ${isUnlocked?'unlocked':''} ${isActive?'active':''}">
          <div><strong>${lvl.badge} ${lvl.name}</strong> (Liv. ${lvl.level})</div>
          <div style="font-weight:700;color:${isUnlocked?'#00e5ff':'rgba(255,255,255,0.5)'}">${statusText}</div>
        </div>
      `;
    });

    overlay.classList.remove('hidden');
    overlay.innerHTML = `
      <div class="menuTitleBox">
        <h1 class="menuTitle" style="font-size:clamp(22px,4vw,34px);">PROFILO GIOCATORE</h1>
        <div class="menuSubTitle">Statistiche e Livello Attuale</div>
      </div>

      <div class="profileSection">
        <div class="profileHeader">
          <div class="profileAvatar">${info.currentLevel.badge}</div>
          <div class="profileInfo">
            <h2>${info.currentLevel.name} (Livello ${info.currentLevel.level})</h2>
            <p>Esperienza totale: <strong>${playerXP} XP</strong></p>
          </div>
        </div>
        <div class="pmXPBarWrap" style="margin-top:12px;">
          <div class="pmXPBarFill" style="width: ${info.progress * 100}%"></div>
        </div>
        <div class="pmXPBarLabels">
          <span>${info.currentLevel.xp} XP</span>
          <span>${info.nextLevel ? info.nextLevel.xp + ' XP' : 'LIV. MAX'}</span>
        </div>
      </div>
      <p style="text-align:left;font-weight:700;margin:6px 0 2px;">Progressione Livelli Neon:</p>
      <div class="lvlList">
        ${lvlItemsHtml}
      </div>
      <button id="btnBackP" class="btnBackNav">← Torna al Menu</button>
    `;
    document.getElementById('btnBackP').onclick = showMenu;
  }

  function showCustomizationMenu(){
    overlay.classList.remove('hidden');
    const playerXP = getStoredXP();
    
    let themeBtns = '';
    const keys = Object.keys(playerThemes);
    for(const key of keys){
      const th = playerThemes[key];
      const isUnlocked = playerXP >= th.reqXP;
      const isSelected = key === selectedThemeKey;
      
      themeBtns += `
        <div class="garageItem ${isSelected?'selected':''} ${!isUnlocked?'locked':''}" onclick="window.selectTheme('${key}', ${isUnlocked})">
          <div style="font-size:22px;margin-bottom:2px;">${th.name.split(' ')[0]}</div>
          <div class="garageItemTitle" style="color:${th.color};">${th.name.replace(/^[^\s]+\s/,'')}</div>
          <div class="garageItemSub">${isUnlocked ? (isSelected ? '✓ In uso' : 'Sbloccato') : '🔒 Liv. ' + th.reqLevel + ' (' + th.reqXP + ' XP)'}</div>
        </div>
      `;
    }

    overlay.innerHTML = `
      <div class="menuTitleBox">
        <h1 class="menuTitle" style="font-size:clamp(22px,4vw,34px);">GARAGE NEON</h1>
        <div class="menuSubTitle">Colori ed Atmosfere sbloccabili con XP</div>
      </div>

      <div class="garageGrid">
        ${themeBtns}
      </div>
      <button id="btnBackC" class="btnBackNav">← Torna al Menu</button>
    `;
    document.getElementById('btnBackC').onclick = showMenu;
  }

  window.selectTheme = function(key, isUnlocked){
    if(!isUnlocked){
      const th = playerThemes[key];
      alert(`🔒 Questo tema richiede Livello ${th.reqLevel} (${th.name}) con ${th.reqXP} XP! Gioca per guadagnare punti ed entrarne in possesso!`);
      return;
    }
    selectedThemeKey = key;
    applyRinkTheme();
    showMenu();
  };

  function assignPointer(pid,cx,cy){
    if(isPaused) return;
    const rect=canvas.getBoundingClientRect();
    const x=cx-rect.left, y=cy-rect.top, m=30;
    if(gameMode==='1p'){
      pointerOwners.set(pid,'g1');
      if(portrait){
        g1Paddle.tx=clamp(x,m+g1Paddle.r,W-m-g1Paddle.r);
        g1Paddle.ty=clamp(y,H/2+24+g1Paddle.r,H-m-g1Paddle.r);
      } else {
        g1Paddle.tx=clamp(x,W/2+24+g1Paddle.r,W-m-g1Paddle.r);
        g1Paddle.ty=clamp(y,m+g1Paddle.r,H-m-g1Paddle.r);
      }
    } else {
      if(portrait){
        if(y<H/2){
          pointerOwners.set(pid,'g2');
          g2Paddle.tx=clamp(x,m+g2Paddle.r,W-m-g2Paddle.r);
          g2Paddle.ty=clamp(y,m+g2Paddle.r,H/2-24-g2Paddle.r);
        } else {
          pointerOwners.set(pid,'g1');
          g1Paddle.tx=clamp(x,m+g1Paddle.r,W-m-g1Paddle.r);
          g1Paddle.ty=clamp(y,H/2+24+g1Paddle.r,H-m-g1Paddle.r);
        }
      } else {
        if(x<W/2){
          pointerOwners.set(pid,'g2');
          g2Paddle.tx=clamp(x,m+g2Paddle.r,W/2-24-g2Paddle.r);
          g2Paddle.ty=clamp(y,m+g2Paddle.r,H-m-g2Paddle.r);
        } else {
          pointerOwners.set(pid,'g1');
          g1Paddle.tx=clamp(x,W/2+24+g1Paddle.r,W-m-g1Paddle.r);
          g1Paddle.ty=clamp(y,m+g1Paddle.r,H-m-g1Paddle.r);
        }
      }
    }
  }

  function movePointer(pid,cx,cy){
    if(isPaused) return;
    const owner=pointerOwners.get(pid);
    if(!owner){ assignPointer(pid,cx,cy); return; }
    const rect=canvas.getBoundingClientRect();
    const x=cx-rect.left, y=cy-rect.top, m=30;
    if(owner==='g1'){
      if(portrait){
        g1Paddle.tx=clamp(x,m+g1Paddle.r,W-m-g1Paddle.r);
        g1Paddle.ty=clamp(y,H/2+24+g1Paddle.r,H-m-g1Paddle.r);
      } else {
        g1Paddle.tx=clamp(x,W/2+24+g1Paddle.r,W-m-g1Paddle.r);
        g1Paddle.ty=clamp(y,m+g1Paddle.r,H-m-g1Paddle.r);
      }
    } else if(owner==='g2' && gameMode==='2p'){
      if(portrait){
        g2Paddle.tx=clamp(x,m+g2Paddle.r,W-m-g2Paddle.r);
        g2Paddle.ty=clamp(y,m+g2Paddle.r,H/2-24-g2Paddle.r);
      } else {
        g2Paddle.tx=clamp(x,m+g2Paddle.r,W/2-24-g2Paddle.r);
        g2Paddle.ty=clamp(y,m+g2Paddle.r,H-m-g2Paddle.r);
      }
    }
  }

  canvas.addEventListener('pointerdown',function(e){
    canvas.setPointerCapture(e.pointerId);
    assignPointer(e.pointerId,e.clientX,e.clientY);
    if(!running) initAudio();
  });
  canvas.addEventListener('pointermove',function(e){ movePointer(e.pointerId,e.clientX,e.clientY); });
  canvas.addEventListener('pointerup',function(e){ pointerOwners.delete(e.pointerId); });
  canvas.addEventListener('pointercancel',function(e){ pointerOwners.delete(e.pointerId); });

  hudBadgeEl.addEventListener('click', showProfileMenu);

  window.addEventListener('keydown', function(e){
    if(e.key === 'Escape' || e.code === 'Escape'){
      togglePause();
    }
  });

  document.getElementById('pauseBtn').onclick = togglePause;
  showMenu();

  window.addEventListener('resize',resize);
  window.addEventListener('orientationchange',function(){ setTimeout(resize,100); });

  resize();
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
